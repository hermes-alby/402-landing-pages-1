name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: astro/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Assemble site
        run: |
          rm -rf ../_site
          # Astro build is served under /ai-tools
          mkdir -p ../_site/ai-tools
          cp -r dist/. ../_site/ai-tools/
          # Static pages are served under /x
          if [ -d ../static ]; then
            # Refresh static/sitemap.xml so it always reflects the pages shipped
            node ../scripts/static_sitemap.mjs
            mkdir -p ../_site/x
            cp -r ../static/. ../_site/x/
          fi
        working-directory: astro

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
